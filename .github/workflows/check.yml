name: check

on:
  push:
    branches: [main]
  pull_request:
  # Link rot is found on a schedule, not by blocking someone's PR on a
  # vendor that happens to be rate-limiting today.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  offline:
    name: Offline checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: shellcheck
        run: sudo apt-get install -y shellcheck
      - name: make check
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -r requirements.txt
          make check

  links:
    name: Link check
    # Only on the schedule and manual runs: this hits third-party hosts and
    # their rate limits, so it must never block a PR.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -r requirements.txt
      - name: make links
        run: make links
